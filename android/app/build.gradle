plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
    id 'com.google.devtools.ksp'
}

android {
    namespace 'com.isf.recorder'
    compileSdk 34

    defaultConfig {
        applicationId "com.isf.recorder"
        minSdk 26
        targetSdk 34
        versionCode 36
        versionName "2.5.6"

        // Fixed server per build type (UserPreferences.serverUrl always returns this).
        buildConfigField "String", "SERVER_URL", '"https://gubandhu.initiativesewafoundation.com/recorder"'

        vectorDrawables {
            useSupportLibrary true
        }
    }

    signingConfigs {
        release {
            storeFile file("isf-release.keystore")
            storePassword "isf-recorder-secure-key-2026"
            keyAlias "isf-recorder"
            keyPassword "isf-recorder-secure-key-2026"
            enableV1Signing = true
            enableV2Signing = true
            enableV3Signing = true
            enableV4Signing = true
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled true          // R8; conservative keep rules in proguard-rules.pro
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            debuggable true
        }
        // Test build that installs next to the real app: ./gradlew assembleStaging -PstagingUrl=http://host:port
        staging {
            initWith release
            signingConfig signingConfigs.release
            applicationIdSuffix ".test"
            versionNameSuffix "-TEST"
            resValue "string", "app_name", "Jomi TEST"
            buildConfigField "String", "SERVER_URL",
                "\"${project.findProperty('stagingUrl') ?: 'http://127.0.0.1:8029'}\""
            matchingFallbacks = ['release']
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    buildFeatures {
        compose true
        buildConfig true
    }
    testOptions {
        unitTests.returnDefaultValues = true   // android.util.Log etc. are no-ops in JVM tests
    }
    packaging {
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
        }
    }
}

ksp {
    // Exported Room schemas (committed) — MigrationSchemaTest checks the hand-written migration against them.
    arg('room.schemaLocation', "$projectDir/schemas")
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.0'
    implementation 'androidx.activity:activity-compose:1.9.0'
    implementation platform('androidx.compose:compose-bom:2024.06.00')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-graphics'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.8.0'

    // OkHttp for networking & upload
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.google.code.gson:gson:2.10.1'

    // Room Database for offline queue
    implementation 'androidx.room:room-runtime:2.6.1'
    implementation 'androidx.room:room-ktx:2.6.1'
    ksp 'androidx.room:room-compiler:2.6.1'

    // WorkManager for background offline sync
    implementation 'androidx.work:work-runtime:2.8.0'
    implementation 'androidx.work:work-runtime-ktx:2.8.0'   // CoroutineWorker

    // Media3 ExoPlayer: authenticated streaming with seek/speed (UI player)
    implementation 'androidx.media3:media3-exoplayer:1.4.1'
    implementation 'androidx.media3:media3-datasource-okhttp:1.4.1'

    // Coroutines
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'

    debugImplementation 'androidx.compose.ui:ui-tooling'

    // JVM unit tests
    testImplementation 'junit:junit:4.13.2'
}
